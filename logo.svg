<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6ff"/>
      <stop offset="0.55" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3a"/>
      <stop offset="1" stop-color="#14181f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2c3547" stroke-width="4"/>
  <!-- three flowing stream lines -->
  <path d="M96 176 C 176 128, 240 224, 320 176 S 432 128, 416 176" fill="none" stroke="url(#flow)" stroke-width="34" stroke-linecap="round"/>
  <path d="M96 256 C 176 208, 240 304, 320 256 S 432 208, 416 256" fill="none" stroke="url(#flow)" stroke-width="34" stroke-linecap="round" opacity="0.85"/>
  <path d="M96 336 C 176 288, 240 384, 320 336 S 432 288, 416 336" fill="none" stroke="url(#flow)" stroke-width="34" stroke-linecap="round" opacity="0.7"/>
  <!-- download arrow dropping into the flow -->
  <path d="M256 84 L 256 196 M 208 148 L 256 200 L 304 148" fill="none" stroke="#eaf6ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
