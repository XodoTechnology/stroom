name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, webview: true,  runner: ubuntu-22.04 }
          - { goos: linux,   goarch: arm64, webview: true,  runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, webview: false, runner: windows-2022 }
          - { goos: windows, goarch: arm64, webview: false, runner: windows-11-arm }
          - { goos: darwin,  goarch: amd64, webview: true,  runner: macos-13 }
          - { goos: darwin,  goarch: arm64, webview: true,  runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install webkit2gtk (linux)
        if: matrix.goos == 'linux' && matrix.webview
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAGS=""
          if [ "${{ matrix.webview }}" = "true" ]; then TAGS="-tags webview"; fi
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build $TAGS -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}"             -o "stroom-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" .

      - name: Checksum
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          F="stroom-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          sha256sum "$F" | awk -v f="$F" '{print $1"  "f}' > "$F.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: stroom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            stroom-${{ matrix.goos }}-${{ matrix.goarch }}*
            icons/icon-512.png
            logo.svg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*             --title "Stroom ${{ github.ref_name }}"             --generate-notes ||           gh release upload "${{ github.ref_name }}" dist/* --clobber
