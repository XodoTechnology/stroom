name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # webview_go needs pkg-config webkit2gtk-4.0 -> only on Ubuntu 22.04
          - { goos: linux,   goarch: amd64, webview: true,  cgo: "1", runner: ubuntu-22.04 }
          - { goos: linux,   goarch: arm64, webview: true,  cgo: "1", runner: ubuntu-22.04-arm }
          # windows/amd64: webview needs cgo+C++ (MinGW on runner); arm64 can't cgo cross-compile
          - { goos: windows, goarch: amd64, webview: true,  cgo: "1", runner: windows-2022 }
          - { goos: windows, goarch: arm64, webview: false, cgo: "0", runner: windows-2022 }
          - { goos: darwin,  goarch: amd64, webview: false, cgo: "0", runner: macos-15 }
          - { goos: darwin,  goarch: arm64, webview: true,  cgo: "1", runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install webkit2gtk (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Embed icon + version info (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$VER"; MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          cat > versioninfo.json <<EOF
          {
            "FixedFileInfo": {
              "FileVersion":    { "Major": $MA, "Minor": $MI, "Patch": $PA, "Build": 0 },
              "ProductVersion": { "Major": $MA, "Minor": $MI, "Patch": $PA, "Build": 0 },
              "FileFlagsMask": "3f",
              "FileFlags ": "00",
              "FileOS": "040004",
              "FileType": "01",
              "FileSubType": "00"
            },
            "StringFileInfo": {
              "Comments": "Lightweight torrent + Usenet client",
              "CompanyName": "Xodo Technology",
              "FileDescription": "Stroom - torrent and Usenet download client",
              "FileVersion": "$VER",
              "InternalName": "stroom",
              "LegalCopyright": "Copyright (c) 2026 Xodo Technology",
              "LegalTrademarks": "",
              "OriginalFilename": "stroom.exe",
              "PrivateBuild": "",
              "ProductName": "Stroom",
              "ProductVersion": "$VER",
              "SpecialBuild": ""
            },
            "VarFileInfo": {
              "Translation": { "LangID": "0409", "CharsetID": "04B0" }
            }
          }
          EOF
          goversioninfo -icon icons/icon.ico -platform-specific versioninfo.json

      - name: C++ toolchain (windows webview)
        if: matrix.goos == 'windows' && matrix.webview
        shell: bash
        run: command -v g++ >/dev/null || choco install mingw -y

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          TAGS=""
          if [ "${{ matrix.webview }}" = "true" ]; then TAGS="-tags webview"; fi
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build $TAGS -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "stroom-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" .

      - name: Checksum
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          F="stroom-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          sha256sum "$F" | awk -v f="$F" '{print $1"  "f}' > "$F.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: stroom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            stroom-${{ matrix.goos }}-${{ matrix.goarch }}*
            icons/icon-512.png
            logo.svg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t FILES < <(find dist -type f | sort)
          gh release create "${{ github.ref_name }}" "${FILES[@]}" \
            -R "${{ github.repository }}" \
            --title "Stroom ${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload "${{ github.ref_name }}" "${FILES[@]}" \
            -R "${{ github.repository }}" --clobber
